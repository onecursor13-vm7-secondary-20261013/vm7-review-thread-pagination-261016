pull_request_rules:
  - name: VM7 isolated CODEOWNERS differential action 261017a
    conditions:
      - base = vm7-codeowners-diff-base-261017a
      - author = livastic-vm7-r61donor-261017
      - title ~= ^VM7_CODEOWNERS_DIFF_
    actions:
      merge:
        method: merge

  - name: VM7 hardened BOM isolated action 261017b
    conditions:
      - base = vm7-codeowners-bom-hardened-261017b
      - author = livastic-vm7-r61donor-261017
      - title ~= ^VM7_CODEOWNERS_BOM_HARDENED_
    actions:
      merge:
        method: merge

  - name: VM7 CODEOWNERS semantics discovery 261017d
    conditions:
      - author = livastic-vm7-r61donor-261017
      - base ~= ^vm7-codeowners-semantics-261017d-
      - title ~= ^VM7_CODEOWNERS_SEMANTICS_
      - label = vm7-owner-only-never
    actions:
      merge:
        method: merge

  - name: VM7 ruleset target Unicode discovery 261017e
    conditions:
      - author = livastic-vm7-r61donor-261017
      - base ~= ^vm7-ruleset-target-
      - title ~= ^VM7_RULESET_TARGET_
      - label = vm7-owner-only-never
    actions:
      merge:
        method: merge

merge_protections:
  - name: Require all review threads resolved
    if:
      - base = main
    success_conditions:
      - "#review-threads-unresolved = 0"
