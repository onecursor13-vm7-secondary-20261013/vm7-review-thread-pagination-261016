merge_protections:
  - name: Require all review threads resolved
    if:
      - base = main
    success_conditions:
      - "#review-threads-unresolved = 0"
  - name: Require GitHub code owner approval
    if:
      - base = vm7-codeowners-diff-base-261017a
    success_conditions:
      - github-code-owner-review-satisfied = true
