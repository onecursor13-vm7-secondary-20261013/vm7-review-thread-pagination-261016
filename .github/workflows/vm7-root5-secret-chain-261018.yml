name: VM7 Review Thread Page2 Protected Secret 261018

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  protected-environment-consumer:
    name: vm7-root5-protected-environment-consumer-261018
    if: github.actor == 'mergify[bot]'
    runs-on: ubuntu-latest
    environment: vm7-root5-reviewthread-secret-env-261018
    steps:
      - uses: actions/checkout@v4
      - name: Execute protected deployment hook
        shell: bash
        env:
          VM7_ROOT5_PROTECTED_SECRET: ${{ secrets.VM7_ROOT5_PROTECTED_SECRET }}
        run: bash ./deploy-vm7-root5-secret-261018.sh
      - name: Publish controlled deployment result
        uses: actions/upload-artifact@v4
        with:
          name: vm7-root5-secret-${{ github.sha }}
          path: vm7-root5-secret-artifact-261018/
          if-no-files-found: error
          retention-days: 1
