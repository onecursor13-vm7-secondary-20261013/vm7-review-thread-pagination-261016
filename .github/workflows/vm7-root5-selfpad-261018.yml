name: VM7 Root5 self-padding protected consumer 261018

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  protected-consumer:
    runs-on: ubuntu-latest
    environment: vm7-root5-selfpad-env-261018
    env:
      ROOT5_SELF_PADDING_SECRET: ${{ secrets.ROOT5_SELF_PADDING_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute repository hook
        run: bash .github/scripts/vm7-root5-selfpad-hook-261018.sh
      - name: Upload protected output
        uses: actions/upload-artifact@v4
        with:
          name: vm7-root5-selfpad-protected-output-261018
          path: protected-secret.bin
